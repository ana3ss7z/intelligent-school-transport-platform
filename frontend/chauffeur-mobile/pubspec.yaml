name: chauffeur_app
description: "Application mobile CHAUFFEUR — transport scolaire intelligent (PFE SDIA)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  web_socket_channel: ^3.0.3
  intl: ^0.20.3

  # ── Spécifique chauffeur (l'app parent est en lecture seule, celle-ci écrit) ──
  # Flux de positions du téléphone → POST /api/gps/position (MS3). Fonctionne
  # aussi sur la cible Chrome via navigator.geolocation.
  # Son `ForegroundNotificationConfig` (Android) tient lui-même le service de
  # premier plan lié au flux de positions : on émet écran verrouillé SANS
  # ACCESS_BACKGROUND_LOCATION et sans second isolate — d'où l'absence de
  # flutter_foreground_task, qui aurait imposé un handler dans un autre isolate
  # (donc re-créer Dio et le JWT là-bas) pour le même résultat.
  geolocator: ^14.0.2
  # Déclencheur de vidange de la file d'attente hors ligne.
  connectivity_plus: ^7.0.0
  # Persistance de la file + du cache de tournée. Choisi plutôt que sqflite
  # (KO sur le web) ou hive (codegen) — et surtout, ne tire PAS path_provider,
  # donc reste à l'écart du piège jni/AGP 9 décrit ci-dessous.
  shared_preferences: ^2.5.3

# Correctif build Android : path_provider_android >= 2.3 tire le package `jni`,
# dont le build.gradle utilise l'ancienne syntaxe `kotlin()` — incompatible avec
# AGP 9 / Gradle 9 (« Could not find method kotlin() on project ':jni' »).
# La 2.2.x rend le même service sans jni. À retirer quand jni sera compatible.
dependency_overrides:
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icône de l'app (source générée par `python tool/generate_icon.py`).
# Teal volontairement différent du bleu de l'app parent : les deux apps doivent
# rester distinguables sur le même téléphone.
# Régénérer les déclinaisons : `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"

flutter:
  uses-material-design: true
