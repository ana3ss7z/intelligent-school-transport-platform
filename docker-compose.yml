version: '3.8'

services:

  # ── Base de données PostgreSQL + PostGIS ──────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: transport_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transport_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache temps réel GPS) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transport_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transport_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (message broker) ─────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: transport_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Dashboard web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - transport_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── pgAdmin (interface web PostgreSQL) ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: transport_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transport.ma
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - transport_network
    depends_on:
      - postgres

# ── Volumes persistants ───────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# ── Réseau interne ────────────────────────────────────────────────────
networks:
  transport_network:
    driver: bridge