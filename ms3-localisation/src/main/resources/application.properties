server.port=8083
spring.application.name=ms3-localisation

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transport_scolaire
spring.datasource.username=transport_user
spring.datasource.password=transport_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis (cache dernière position GPS)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# JWT
jwt.secret=transport_scolaire_secret_key_2026_super_long

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always