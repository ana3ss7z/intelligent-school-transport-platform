# Serveur
server.port=8087
spring.application.name=ms7-auth

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transport_scolaire
spring.datasource.username=transport_user
spring.datasource.password=transport_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=transport_scolaire_secret_key_2026_super_long
jwt.expiration=86400000

spring.docker.compose.enabled=false