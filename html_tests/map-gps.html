<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport Scolaire — Carte GPS Meknès</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.3px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-ms3  { background: #1e3a5f; color: #60a5fa; }
    .badge-osrm { background: #1a3a2a; color: #4ade80; }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid #2d3148;
    }
    .sidebar-section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 10px;
    }

    /* Auth */
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 7px 10px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      margin-bottom: 6px;
    }
    input:focus { outline: none; border-color: #3b82f6; }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-blue   { background: #2563eb; color: #fff; }
    .btn-green  { background: #16a34a; color: #fff; }
    .btn-orange { background: #ea580c; color: #fff; }
    .btn-red    { background: #dc2626; color: #fff; margin-top: 4px; }
    .btn-gray   { background: #374151; color: #e2e8f0; margin-top: 4px; }

    .status-line {
      font-size: 11px;
      margin-top: 6px;
      min-height: 16px;
      color: #94a3b8;
    }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }

    /* Bus status cards */
    .bus-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f1117;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #2d3148;
    }
    .bus-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .bus-info { flex: 1; min-width: 0; }
    .bus-name { font-size: 12px; font-weight: 600; }
    .bus-coords { font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* OSRM */
    .route-btn {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .route-btn button { flex: 1; }

    /* Log */
    .log-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .log-entry {
      font-size: 10px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      padding: 2px 0;
      border-bottom: 1px solid #1e2235;
      line-height: 1.5;
    }
    .log-entry.gps  { color: #60a5fa; }
    .log-entry.ok   { color: #4ade80; }
    .log-entry.warn { color: #fbbf24; }
    .log-entry.err  { color: #f87171; }

    /* ── Map ── */
    #map {
      flex: 1;
      background: #1a1d27;
    }

    /* Leaflet dark tiles */
    .leaflet-tile-pane { filter: brightness(0.85) saturate(0.8); }

    /* WS indicator */
    .ws-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #374151;
      display: inline-block;
      margin-right: 5px;
      transition: background 0.3s;
    }
    .ws-dot.active { background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

<header>
  <h1>🚌 Transport Scolaire — Meknès</h1>
  <span class="badge badge-ms3">MS3 WebSocket</span>
  <span class="badge badge-osrm">OSRM Routes</span>
  <span style="margin-left:auto; font-size:12px; color:#64748b">
    <span class="ws-dot" id="wsDot"></span>
    <span id="wsStatusText">Disconnected</span>
  </span>
</header>

<div class="main">

  <!-- ── Sidebar ── -->
  <div class="sidebar">

    <!-- Auth -->
    <div class="sidebar-section">
      <h2>Authentification</h2>
      <input type="text"     id="gatewayUrl" value="http://localhost:8080" placeholder="Gateway URL">
      <input type="email"    id="email"      placeholder="Email admin">
      <input type="password" id="password"   placeholder="Mot de passe">
      <button class="btn-blue" onclick="login()">🔑 Login</button>
      <div class="status-line" id="authStatus"></div>
    </div>

    <!-- WebSocket -->
    <div class="sidebar-section">
      <h2>WebSocket GPS</h2>
      <input type="text" id="wsUrl" value="ws://localhost:8083/ws/gps" placeholder="WebSocket URL">
      <button class="btn-green"  onclick="connectWS()">🔌 Connecter</button>
      <button class="btn-red"    onclick="disconnectWS()">✕ Déconnecter</button>
    </div>

    <!-- OSRM Routes -->
    <div class="sidebar-section">
      <h2>Trajets OSRM</h2>
      <input type="text" id="osrmUrl" value="http://localhost:5000" placeholder="OSRM URL">
      <div class="route-btn">
        <button class="btn-green" style="font-size:10px" onclick="afficherTrajet(1)">Circuit 1</button>
        <button class="btn-orange" style="font-size:10px" onclick="afficherTrajet(2)">Circuit 2</button>
        <button class="btn-blue" style="font-size:10px" onclick="afficherTrajet(3)">Circuit 3</button>
      </div>
      <button class="btn-gray" onclick="effacerTrajets()">🗑 Effacer trajets</button>
      <div class="status-line" id="osrmStatus"></div>
    </div>

    <!-- Bus status -->
    <div class="sidebar-section">
      <h2>Bus en temps réel</h2>
      <div id="busCards">
        <div style="font-size:11px; color:#64748b">En attente de positions GPS...</div>
      </div>
    </div>

    <!-- Log -->
    <div class="sidebar-section" style="flex-shrink:0">
      <h2>Log temps réel
        <button onclick="clearLog()" style="width:auto;padding:1px 6px;font-size:9px;background:#374151;color:#e2e8f0;border-radius:4px;float:right">clear</button>
      </h2>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>

  <!-- ── Map ── -->
  <div id="map"></div>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let map, ws, token;
let busMarkers  = {};  // busId → Leaflet marker
let routeLayers = [];  // Leaflet polylines for OSRM routes
const busColors = { 1: '#3b82f6', 2: '#f97316', 3: '#22c55e' };
const busPositions = {};

// ─── Circuits OSRM (arrêts Meknès) ──────────────────────────────────────────
const CIRCUITS = {
  1: { nom: "Médina → Marjane", arrets: [
    { nom: "Médina",    lat: 33.8935, lng: -5.5547 },
    { nom: "Hamria",    lat: 33.8978, lng: -5.5489 },
    { nom: "Zitoune",   lat: 33.9012, lng: -5.5523 },
    { nom: "Wislane",   lat: 33.9067, lng: -5.5456 },
    { nom: "Marjane",   lat: 33.8821, lng: -5.5234 },
  ]},
  2: { nom: "Ismailia → Nouzhat", arrets: [
    { nom: "Ismailia",  lat: 33.8876, lng: -5.5612 },
    { nom: "Mellah",    lat: 33.8901, lng: -5.5598 },
    { nom: "Sidi Baba", lat: 33.8845, lng: -5.5534 },
    { nom: "Ain Karma", lat: 33.8712, lng: -5.5312 },
    { nom: "Nouzhat",   lat: 33.8789, lng: -5.5267 },
  ]},
  3: { nom: "Al Manzeh → Hay Salam", arrets: [
    { nom: "Al Manzeh",        lat: 33.8756, lng: -5.5401 },
    { nom: "Riad",             lat: 33.8834, lng: -5.5378 },
    { nom: "Sidi Said",        lat: 33.8956, lng: -5.5445 },
    { nom: "Borj Moulay Omar", lat: 33.8923, lng: -5.5689 },
    { nom: "Hay Salam",        lat: 33.8698, lng: -5.5478 },
  ]},
};

// ─── Map init ────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([33.8935, -5.5547], 13);

  // Dark tile — CartoDB Dark Matter
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
}

// ─── Bus marker icon ─────────────────────────────────────────────────────────
function busIcon(busId, cap) {
  const color = busColors[busId] || '#94a3b8';
  return L.divIcon({
    className: '',
    html: `
      <div style="
        width:32px; height:32px;
        background:${color};
        border-radius:50% 50% 50% 0;
        transform: rotate(${(cap || 0) - 45}deg);
        border: 2px solid #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        display:flex; align-items:center; justify-content:center;
        font-size:14px;
      ">
        <span style="transform:rotate(${45 - (cap || 0)}deg)">🚌</span>
      </div>`,
    iconSize:   [32, 32],
    iconAnchor: [16, 16],
  });
}

// ─── Auth ────────────────────────────────────────────────────────────────────
async function login() {
  const url   = document.getElementById('gatewayUrl').value;
  const email = document.getElementById('email').value;
  const pass  = document.getElementById('password').value;
  setAuthStatus('⏳ Connexion...', '');
  try {
    const res  = await fetch(`${url}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, motDePasse: pass })
    });
    const data = await res.json();
    token = data.token;
    if (!token) throw new Error('Token absent');
    setAuthStatus(`✅ ${data.role} — ${data.nom}`, 'ok');
    log(`Token obtenu (${data.role})`, 'ok');
  } catch (e) {
    setAuthStatus(`❌ ${e.message}`, 'err');
  }
}

// ─── WebSocket ───────────────────────────────────────────────────────────────
function connectWS() {
  const url = document.getElementById('wsUrl').value;
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({ subscribe: 'ALL' }));
    setWS(true);
    log('WebSocket connecté', 'ok');
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'subscribed') { log(`Abonné: ${data.filtre}`, 'ok'); return; }
    handleGpsMessage(data);
  };

  ws.onerror  = () => log('Erreur WebSocket', 'err');
  ws.onclose  = () => { setWS(false); log('WebSocket déconnecté', 'warn'); };
}

function disconnectWS() {
  if (ws) ws.close();
}

function handleGpsMessage(pos) {
  const { cibleType, cibleId, latitude, longitude, vitesse, cap } = pos;
  if (cibleType !== 'BUS') return;

  busPositions[cibleId] = pos;
  const latlng = [latitude, longitude];
  const color  = busColors[cibleId] || '#94a3b8';

  // Créer ou déplacer le marker
  if (busMarkers[cibleId]) {
    busMarkers[cibleId].setLatLng(latlng);
    busMarkers[cibleId].setIcon(busIcon(cibleId, cap));
  } else {
    busMarkers[cibleId] = L.marker(latlng, { icon: busIcon(cibleId, cap) })
      .addTo(map)
      .bindPopup(`<b>Bus ${cibleId}</b>`);
  }

  // Mettre à jour les cards sidebar
  updateBusCards();

  log(`🚌 Bus ${cibleId} → (${latitude.toFixed(4)}, ${longitude.toFixed(4)}) ${vitesse ? vitesse+'km/h' : ''}`, 'gps');
}

// ─── OSRM Routes ─────────────────────────────────────────────────────────────
async function afficherTrajet(circuitId) {
  const circuit = CIRCUITS[circuitId];
  const osrmUrl = document.getElementById('osrmUrl').value;
  const color   = busColors[circuitId];
  const arrets  = circuit.arrets;

  document.getElementById('osrmStatus').textContent = `⏳ Calcul ${circuit.nom}...`;

  const allPoints = [];
  const stopMarkers = [];

  for (let i = 0; i < arrets.length - 1; i++) {
    const dep = arrets[i];
    const arr = arrets[i + 1];

    try {
      const url = `${osrmUrl}/route/v1/driving/${dep.lng},${dep.lat};${arr.lng},${arr.lat}?overview=full&geometries=geojson`;
      const res  = await fetch(url);
      const data = await res.json();

      if (data.code === 'Ok') {
        const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        allPoints.push(...coords);
      }
    } catch (e) {
      log(`OSRM non disponible — ligne droite`, 'warn');
      allPoints.push([dep.lat, dep.lng], [arr.lat, arr.lng]);
    }
  }

  // Tracer la polyline
  const polyline = L.polyline(allPoints, {
    color, weight: 4, opacity: 0.8,
    dashArray: null
  }).addTo(map);
  routeLayers.push(polyline);

  // Marqueurs arrêts
  arrets.forEach((arret, i) => {
    const isFirst = i === 0;
    const isLast  = i === arrets.length - 1;
    const marker = L.circleMarker([arret.lat, arret.lng], {
      radius: isFirst || isLast ? 8 : 5,
      fillColor: color,
      color: '#fff',
      weight: 2,
      fillOpacity: 1
    }).addTo(map).bindPopup(`<b>${arret.nom}</b><br>Arrêt ${i + 1}`);
    routeLayers.push(marker);
  });

  map.fitBounds(L.polyline(allPoints).getBounds(), { padding: [40, 40] });
  document.getElementById('osrmStatus').innerHTML = `<span class="ok">✅ ${circuit.nom} — ${allPoints.length} points</span>`;
  log(`Trajet OSRM circuit ${circuitId} affiché (${allPoints.length} pts)`, 'ok');
}

function effacerTrajets() {
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  document.getElementById('osrmStatus').textContent = 'Trajets effacés';
}

// ─── Bus Cards Sidebar ────────────────────────────────────────────────────────
function updateBusCards() {
  const container = document.getElementById('busCards');
  if (Object.keys(busPositions).length === 0) return;

  container.innerHTML = Object.entries(busPositions).map(([id, pos]) => `
    <div class="bus-card">
      <div class="bus-dot" style="background:${busColors[id] || '#94a3b8'}"></div>
      <div class="bus-info">
        <div class="bus-name">Bus ${id}</div>
        <div class="bus-coords">${pos.latitude.toFixed(5)}, ${pos.longitude.toFixed(5)}</div>
        <div class="bus-coords">${pos.vitesse ? pos.vitesse + ' km/h' : ''} ${pos.cap ? '| cap ' + Math.round(pos.cap) + '°' : ''}</div>
      </div>
    </div>
  `).join('');
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function setAuthStatus(msg, cls) {
  const el = document.getElementById('authStatus');
  el.textContent = msg;
  el.className = `status-line ${cls}`;
}

function setWS(connected) {
  document.getElementById('wsDot').className = `ws-dot ${connected ? 'active' : ''}`;
  document.getElementById('wsStatusText').textContent = connected ? 'Connected' : 'Disconnected';
}

function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const ts  = new Date().toLocaleTimeString();
  box.innerHTML += `<div class="log-entry ${type}">[${ts}] ${msg}</div>`;
  box.scrollTop  = box.scrollHeight;
}

function clearLog() {
  document.getElementById('logBox').innerHTML = '';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
initMap();
</script>
</body>
</html>
