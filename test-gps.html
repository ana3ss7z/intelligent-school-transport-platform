<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GPS WebSocket Test — MS3</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    h2   { color: #4ec9b0; }
    #status  { margin: 10px 0; font-weight: bold; }
    #log     { background: #252526; border: 1px solid #444; padding: 10px;
               height: 300px; overflow-y: auto; font-size: 13px; }
    .msg     { color: #9cdcfe; margin: 2px 0; }
    .ok      { color: #4ec9b0; }
    .err     { color: #f44747; }
    input, button, select {
      margin: 5px 2px; padding: 6px 10px;
      background: #3c3c3c; color: #d4d4d4;
      border: 1px solid #555; border-radius: 4px;
    }
    button { cursor: pointer; background: #0e639c; border-color: #0e639c; }
    button:hover { background: #1177bb; }
    label { font-size: 13px; }
  </style>
</head>
<body>

<h2>🛰️ GPS WebSocket Test — MS3 (port 8083)</h2>

<!-- ─── Config ─────────────────────────────────────── -->
<div>
  <label>Auth URL:</label>
  <input id="authUrl" value="http://localhost:8087" size="30">
  <label>GPS URL:</label>
  <input id="gpsUrl"  value="http://localhost:8083" size="30">
</div>
<div>
  <input id="email"    placeholder="admin email"    size="28">
  <input id="password" placeholder="password" type="password" size="20">
  <button onclick="login()">🔑 Login</button>
  <span id="tokenStatus"></span>
</div>

<!-- ─── WebSocket ───────────────────────────────────── -->
<div style="margin-top:12px">
  <button onclick="connectWS()">🔌 Connect WebSocket</button>
  <button onclick="disconnectWS()">❌ Disconnect</button>
  <span id="status" class="err">● Disconnected</span>
</div>

<!-- ─── Publish position ───────────────────────────── -->
<div style="margin-top:12px">
  <label>Type:</label>
  <select id="cibleType">
    <option>BUS</option>
    <option>ELEVE</option>
  </select>
  <label>ID:</label>
  <input id="cibleId" value="1" size="4">
  <label>Lat:</label>
  <input id="lat" value="33.8935" size="10">
  <label>Lng:</label>
  <input id="lng" value="-5.5547" size="10">
  <label>Vitesse:</label>
  <input id="vitesse" value="42.0" size="5">
  <button onclick="publishPosition()">📍 Publish GPS</button>
</div>

<!-- ─── Log ─────────────────────────────────────────── -->
<div style="margin-top:12px">
  <strong>WebSocket messages :</strong>
  <button onclick="clearLog()" style="font-size:11px;padding:3px 8px">clear</button>
</div>
<div id="log"></div>

<script>
  let ws    = null;
  let token = null;

  // ─── Login ─────────────────────────────────────────
  async function login() {
    const authUrl = document.getElementById('authUrl').value;
    const email   = document.getElementById('email').value;
    const pass    = document.getElementById('password').value;

    try {
      const res  = await fetch(`${authUrl}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, motDePasse: pass })
      });
      const data = await res.json();
      console.log('MS7 login response:', JSON.stringify(data));
      token = data.token || data.accessToken || data.jwt || data.access_token;
      const role = data.role || data.userRole || '?';
      if (!token) throw new Error('Token field not found — check F12 console');
      document.getElementById('tokenStatus').innerHTML =
        `<span class="ok">✅ Token OK (${role})</span>`;
    } catch (e) {
      document.getElementById('tokenStatus').innerHTML =
        `<span class="err">❌ Login failed: ${e.message}</span>`;
    }
  }

  // ─── WebSocket ─────────────────────────────────────
  function connectWS() {
    const gpsUrl = document.getElementById('gpsUrl').value
                       .replace('http://', 'ws://')
                       .replace('https://', 'wss://');
    ws = new WebSocket(`${gpsUrl}/ws/gps`);

    ws.onopen = () => {
      setStatus(true);
      ws.send(JSON.stringify({ subscribe: 'ALL' }));
      log('🔌 Connected — subscribed to ALL', 'ok');
    };

    ws.onmessage = (e) => {
      const pos = JSON.parse(e.data);
      if (pos.type === 'subscribed') {
        log(`📡 Subscribed: ${pos.filtre}`, 'ok');
      } else {
        log(`📍 ${pos.cibleType} #${pos.cibleId} → (${pos.latitude}, ${pos.longitude}) | ${pos.vitesse ?? '?'} km/h | ${pos.horodatage}`, 'msg');
      }
    };

    ws.onerror = (e) => log(`❌ Error: ${e}`, 'err');
    ws.onclose = ()  => { setStatus(false); log('🔌 Disconnected', 'err'); };
  }

  function disconnectWS() {
    if (ws) ws.close();
  }

  // ─── Publish ───────────────────────────────────────
  async function publishPosition() {
    if (!token) { alert('Login first'); return; }
    const gpsUrl = document.getElementById('gpsUrl').value;

    const body = {
      cibleType: document.getElementById('cibleType').value,
      cibleId:   parseInt(document.getElementById('cibleId').value),
      latitude:  parseFloat(document.getElementById('lat').value),
      longitude: parseFloat(document.getElementById('lng').value),
      vitesse:   parseFloat(document.getElementById('vitesse').value),
    };

    try {
      const res = await fetch(`${gpsUrl}/api/gps/position`, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      log(`✅ POST OK → id=${data.id} saved`, 'ok');
    } catch (e) {
      log(`❌ POST failed: ${e.message}`, 'err');
    }
  }

  // ─── Helpers ───────────────────────────────────────
  function setStatus(up) {
    const el = document.getElementById('status');
    el.textContent = up ? '● Connected' : '● Disconnected';
    el.className   = up ? 'ok' : 'err';
  }

  function log(msg, cls) {
    const div = document.getElementById('log');
    const ts  = new Date().toLocaleTimeString();
    div.innerHTML += `<div class="${cls}">[${ts}] ${msg}</div>`;
    div.scrollTop  = div.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
  }
</script>

</body>
</html>
